services:
  postgres:
    image: postgres:15
    container_name: wordforge-pg
    environment:
      POSTGRES_USER: wordforge
      POSTGRES_PASSWORD: wordforge
      POSTGRES_DB: wordforge
    ports:
      - "5433:5432"
    volumes:
      - wordforge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordforge"]
      interval: 3s
      timeout: 3s
      retries: 10

  wordforge-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      WORDFORGE_WEB_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  wordforge_pg_data:
