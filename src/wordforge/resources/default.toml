# wordforge stage pipeline configuration (v9 spec §6: parser_version;
# v9 spec §7: CLI plan/run; lives inside the package so importlib.resources
# finds it whether running from a git checkout or an installed wheel).
#
# `parser_version` MUST be bumped by hand when parser / client / post-
# processing semantics change (see spec §6). Changes here invalidate
# that stage's fingerprint → re-run (cache still hits to save API cost).
#
# ── 2026-08-17 provider migration ─────────────────────────────────────────
# Bedrock / Gemini / OpenAI(直连) / DashScope-Qwen 账号全部失效。所有 stage 迁移
# 到 openai completer + OPENAI_BASE_URL（OpenAI 兼容端点）。默认按 DeepSeek 命名；
# 换供应商（Kimi / GLM / 硅基流动）时只改这里的 model 名，不动代码。
# DeepSeek 目前只有 chat/reasoner 两档，原"质量档/便宜档"双轨暂时并轨为
# deepseek-chat；50 词验证批次（见 reviewer/config.py 同步说明）若显示分层
# 有收益，再在 GLM（glm-4.6 / glm-4.5-air）或硅基流动（Qwen 系）上恢复双轨。
# 下方 cost_estimate_usd 均为迁移前的旧模型数据，待 50 词批次实测后重标。

[stages.fetch_dict]
parser_version = "1"
cost_estimate_usd = 0.0   # dict scrape, no LLM

[stages.paraphrase]
parser_version = "1"
prompt_version = "v1"
provider = "openai"
# Quality-critical — ~83% of momo words shortcut this stage via
# WORDFORGE_MOMO_REF_FILE (0 LLM cost); the remaining 17% needs the
# strongest general tier. Was sonnet-4-6 via bedrock until 2026-08.
model = "deepseek-chat"
cost_estimate_usd = 0.0002   # 旧值 0.0014 (sonnet)，按 ~10× 差价预估，待实测

[stages.paraphrase_rerank]
# Not a real stage (build_stages skips it); config-only "sub-stage" so
# _rerank_meanings() can swap its model without code edits. Task is
# pattern-matching (reorder existing meanings by frequency), so quality =
# cost weight. Was gemini-2.5-flash until 2026-08.
# Short-circuits when meanings <= 3 keeps volume bounded.
parser_version = "1"
prompt_version = "v1"
provider = "openai"
model = "deepseek-chat"
cost_estimate_usd = 0.00005   # 待实测

[stages.phonetic]
parser_version = "1"
cost_estimate_usd = 0.0

[stages.derivatives]
parser_version = "1"
prompt_version = "v1"
provider = "openai"
# Morphological lookup (plural/past_tense/synonyms); pattern-matching task.
# Was gemini-2.5-flash until 2026-08.
model = "deepseek-chat"
cost_estimate_usd = 0.00005   # 待实测

[stages.examples]
parser_version = "1"
# v2 (2026-05-01): feeds dictionary examples (collins + ec + blng_sents_part
# from fetch_dict) as style reference with explicit "inspiration only, never
# copy verbatim" + "supporting vocabulary easier than target" constraints.
prompt_version = "v2"
provider = "openai"
# Example sentences + CN translation alignment is the most user-visible
# pattern-match stage. Was gpt-5-mini until 2026-08.
model = "deepseek-chat"
cost_estimate_usd = 0.0002   # 待实测

[stages.mnemonic]
parser_version = "1"
prompt_version = "v1"
provider = "openai"
# Creative phonetic-pun generation — highest-value field; quality 2× weight.
# Was sonnet-4-6 via bedrock until 2026-08. 注意 2026-05-01 的盲测里
# qwen3-max 输给了 sonnet（中文谐音梗场景感弱）；DeepSeek 中文创造力是
# 强项，但此 stage 是 50 词验证批次的重点对比对象——若不敌，优先试
# kimi-k2（中文谐音梗传统强项）再试 glm 旗舰。
model = "deepseek-chat"
cost_estimate_usd = 0.0004   # 待实测

[stages.quality_gate]
parser_version = "1"
cost_estimate_usd = 0.0

[stages.export]
parser_version = "1"
cost_estimate_usd = 0.0

# budget_cap_usd per batch: absent key = unbounded. DBA overrides via
# UPDATE pipeline.batches SET budget_cap_usd = ... WHERE id = 'Bxx'.
# default_budget_cap_usd = 50.0   # example; leave commented for "no cap"
