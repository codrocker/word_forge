services:
  postgres-test:
    image: postgres:15
    container_name: wordforge-pg-test
    environment:
      POSTGRES_USER: wordforge
      POSTGRES_PASSWORD: wordforge
      POSTGRES_DB: wordforge_test
    ports:
      - "5434:5432"
    volumes:
      - wordforge_pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordforge -d wordforge_test"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  wordforge_pg_test_data:
