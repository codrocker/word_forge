[project]
name = "wordforge"
version = "0.0.1"
description = "Vocabulary-app data production pipeline"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "httpx>=0.27",
  "typer>=0.12",
  "google-genai>=1.0",
  "google-auth>=2.0",
  "openai>=1.50",
  "oss2>=2.18",
  "pymysql>=1.1",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]
llm = [
  "anthropic>=0.30",
  "boto3>=1.34",
]
web = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "argon2-cffi>=23.1",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.7",
  "pydantic[email]>=2.0",
  "httpx>=0.27",
]

[project.scripts]
wordforge = "wordforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
